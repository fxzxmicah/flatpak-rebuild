# Match the downstream Wine-tkg build options.
_NOLIB32="wow64"
_configure_userargs64="--with-pulse --with-gstreamer --without-alsa --without-coreaudio --without-oss --without-ffmpeg --without-sane --without-pcsclite --without-piper --without-vosk --without-netapi --without-capi --without-osmesa --without-xinerama --disable-powershell --disable-winemenubuilder --disable-win16"
_configure_userargs32="${_configure_userargs64}"
_ci_build="true"

# Flatpak supplies sources and dependencies; installation uses FLATPAK_DEST.
_FLATPAK_SOURCE_ROOT="${_where}/sources"
_build_in_tmpfs="false"
_nomakepkg_dependency_autoresolver="false"
_NOINITIALPROMPT="true"
_LOCAL_PRESET="none"
