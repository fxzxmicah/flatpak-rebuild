name: Build and Publish Flatpak Packages

on:
  push:
    paths:
      - PATCHES/**
      - MANIFESTS/**
      - .github/workflows/rebuild.yml

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.enumerate.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enumerate
        id: enumerate
        run: |
          echo "matrix=$(find MANIFESTS PATCHES -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -R . | jq -sc '{app: .}')" >> "${GITHUB_OUTPUT}"

  build:
    needs: enumerate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.enumerate.outputs.matrix) }}

    steps:
      - name: Checkout base
        uses: actions/checkout@v7

      - name: Checkout source
        id: checkout
        uses: actions/checkout@v7
        if: hashFiles(format('MANIFESTS/{0}/**', matrix.app)) == ''
        with:
          repository: flathub/${{ matrix.app }}
          path: MANIFESTS/${{ matrix.app }}
          submodules: recursive

      - name: Apply patches
        if: steps.checkout.outcome == 'success'
        env:
          PACKAGE: ${{ matrix.app }}
        run: |
          for patch in "PATCHES/${PACKAGE}/"*.patch; do
            git apply --directory="MANIFESTS/${PACKAGE}" -p2 "${patch}"
          done

      - name: Prepare recipe
        id: resolution
        env:
          PACKAGE: ${{ matrix.app }}
        run: |
          manifest=$(find "MANIFESTS/${PACKAGE}" -maxdepth 1 -type f \( -name "${PACKAGE}.json" -o -name "${PACKAGE}.yaml" -o -name "${PACKAGE}.yml" \))
          test -n "${manifest}"
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - name: Import key
        id: importation
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ steps.resolution.outputs.manifest }}
          branch: stable
          build-bundle: false
          gpg-sign: ${{ steps.importation.outputs.fingerprint }}
          cache-key: flatpak-builder-${{ matrix.app }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}
          path: repo/
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: flatpak-oss-publish

    steps:
      - name: Install utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ostree flatpak

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: sources

      - name: Import key
        id: importation
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate repository
        env:
          SIGNING_KEY: ${{ steps.importation.outputs.fingerprint }}
        run: |
          ostree init --mode=archive-z2 --repo=flatpak
          for repo in sources/*; do
            # Ensure the refs/remotes directory exists
            mkdir -p "${repo}/refs/remotes"
            ostree pull-local --repo=flatpak "${PWD}/${repo}"
          done
          flatpak build-update-repo --gpg-sign="${SIGNING_KEY}" flatpak

      - name: Setup ossutil
        id: installation
        uses: fxzxzyra/setup-ossutil@v1
        with:
          endpoint: ${{ secrets.END_POINT }}
          region: ${{ secrets.OSS_REGION }}
          bucket: ${{ secrets.OSS_BUCKET }}
          access-key-id: ${{ secrets.ACCESSKEY_ID }}
          access-key-secret: ${{ secrets.ACCESSKEY_SECRET }}

      - name: Publish repository
        env: ${{ fromJSON(steps.installation.outputs.secrets) }}
        run: |
          cat > flatpak/github.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Github
          Url=https://${OSS_BUCKET}.${OSS_ENDPOINT}/flatpak
          Homepage=${{ github.server_url }}/${{ github.repository }}
          Comment=Rebuild repository for Flatpak applications
          Description=Rebuild repository for Flatpak applications
          GPGKey=$(gpg --export "${{ steps.importation.outputs.fingerprint }}" | base64 -w0)
          EOF
          ossutil sync flatpak/ "oss://${OSS_BUCKET}/flatpak/" --force --delete
